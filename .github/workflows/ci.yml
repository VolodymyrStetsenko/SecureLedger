name: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); if ($3 + 0 < 65) exit 1 }'
      - name: Lint OpenAPI contract
        env:
          REDOCLY_TELEMETRY: "off"
        run: npx --yes @redocly/cli@2.38.0 lint api/openapi.yaml
      - name: Build
        run: go build -buildvcs=false ./cmd/secureledger

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: secureledger
          POSTGRES_USER: secureledger
          POSTGRES_PASSWORD: secureledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureledger -d secureledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://secureledger:secureledger@localhost:5432/secureledger?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - name: Validate PostgreSQL constraints and append-only triggers
        run: ./scripts/test-postgres-schema.sh
